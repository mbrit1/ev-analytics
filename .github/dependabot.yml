version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    cooldown:
      semver-patch-days: 1
      semver-minor-days: 3
      semver-major-days: 14
    # Temporary TypeScript 7 hold. PR #174 cannot install because the current
    # typescript-eslint peer range excludes TypeScript 7.
    #
    # Remove this rule only when:
    # 1. https://typescript-eslint.io/users/dependency-versions/ lists
    #    TypeScript 7 as officially supported.
    # 2. The installed typescript-eslint release declares a peer dependency
    #    range that includes TypeScript 7.
    # 3. npm ci succeeds without --force or --legacy-peer-deps.
    #
    # After removal, validate the TypeScript upgrade with typecheck, lint,
    # tests, build, and a TypeScript 6 versus 7 timing comparison.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      production-dependency-patches:
        dependency-type: "production"
        update-types:
          - "patch"
      production-dependency-minors:
        dependency-type: "production"
        update-types:
          - "minor"
      dev-dependency-patches:
        dependency-type: "development"
        update-types:
          - "patch"
      dev-dependency-minors:
        dependency-type: "development"
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
